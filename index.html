<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Look Closer × ArtHunt — Palais des Beaux-Arts de Lille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF; --paper2:#F3F3F3; --card:#FFFFFF; --ink:#111111; --ink2:#333333; --mute:#7A7A7A; --rule:#DDDDDD; --rule2:#EEEEEE;
  --accent:#D8383F; --ok:#111111; --gold:#111111;
  --serif:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sans:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;
  --a:var(--accent);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
a{color:inherit}
em{font-style:italic}
img{display:block}

/* ============ frame ============ */
#screen{position:relative;background:var(--paper);overflow:hidden}
#app{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#side,#full{display:none}
body.curator #stage{display:none}
body.curator #full{display:block}
@media (max-width:999px){ #screen{height:100vh;height:100dvh} }
@media (min-width:1000px){
  body{background:var(--paper2)}
  #stage{display:grid;grid-template-columns:auto minmax(420px,600px);gap:72px;justify-content:center;align-items:center;min-height:100vh;padding:32px 40px}
  #device{padding:10px;border-radius:52px;background:#141210;box-shadow:0 40px 90px -20px rgba(40,30,15,.45),0 0 0 1px #000}
  #screen{width:384px;height:min(820px,calc(100vh - 84px));border-radius:42px}
  #side{display:block}
}

/* ============ type & primitives ============ */
.pad{padding:22px 22px 36px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.eyebrow b{color:var(--ink);font-weight:500}
.display{font-family:var(--serif);font-weight:400;font-size:46px;line-height:.98;letter-spacing:-.015em}
.display em{color:var(--accent)}
.h2{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.02;letter-spacing:-.01em}
.h2 em{color:var(--accent)}
.q{font-family:var(--serif);font-weight:400;font-size:27px;line-height:1.12;letter-spacing:-.005em;margin:12px 0 18px}
.lead{font-size:15px;line-height:1.5;color:var(--ink2)}
.rule{height:1px;background:var(--rule);margin:22px 0}
.fine{font-family:var(--mono);font-size:11px;color:var(--mute);text-align:center;margin-top:12px;line-height:1.6;letter-spacing:.02em}
.fine a{text-underline-offset:3px}
.btn{display:flex;justify-content:space-between;align-items:center;width:100%;padding:18px 20px;border-radius:2px;background:var(--ink);color:var(--paper);font-weight:600;font-size:16px;letter-spacing:.005em;margin-top:16px;transition:background .2s,transform .1s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.3;pointer-events:none}
.btn .ar{font-family:var(--mono);font-weight:400}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.quiet{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn.acc{background:var(--accent)}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);border:1px solid var(--rule);padding:2px 6px;border-radius:2px;vertical-align:1px}
.mark{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:2px;color:#fff;font-family:var(--serif);font-size:18px;line-height:1;flex:none}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fade{animation:fade .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@keyframes pulse{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ top bars ============ */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 22px 14px}
.brand{font-family:var(--serif);font-size:24px;letter-spacing:-.01em;line-height:1}
.brand i{color:var(--accent)}
.langbtn{font-family:var(--mono);font-size:12px;letter-spacing:.06em;padding:6px 9px;border:1px solid var(--rule);border-radius:2px}
.hud{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;background:rgba(244,240,232,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--rule)}
.hud-team{display:flex;align-items:center;gap:9px;min-width:0;font-weight:600;font-size:14px}
.hud-team span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-r{display:flex;align-items:center;gap:6px;flex:none}
.hud-cell{font-family:var(--mono);font-size:12px;padding:5px 7px;border:1px solid var(--rule);border-radius:2px;white-space:nowrap}
.hud-cell.low{color:var(--accent);border-color:var(--accent)}
.hud-score{font-family:var(--mono);font-size:13px;font-weight:500;padding:5px 8px;background:var(--ink);color:var(--paper);border-radius:2px;min-width:62px;text-align:right}
.hud-btn{font-family:var(--mono);font-size:11px;padding:5px 6px;border:1px solid var(--rule);border-radius:2px;display:grid;place-items:center;min-width:28px;height:27px}
.progress{display:flex;align-items:center;gap:12px;padding:12px 22px 0}
.progress .segs{flex:1;display:flex;gap:4px}
.progress .segs i{flex:1;height:2px;background:var(--rule)}
.progress .segs i.on{background:var(--ink)}
.progress .lbl{font-family:var(--mono);font-size:11px;color:var(--mute);white-space:nowrap}

/* ============ welcome ============ */
.trip{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:3px;height:236px;margin:0 22px}
.trip div{overflow:hidden;background:#222}
.trip img{width:100%;height:100%;object-fit:cover;filter:saturate(.95)}
.trip div:nth-child(1) img{object-position:30% 40%}
.trip div:nth-child(2) img{object-position:50% 70%}
.trip div:nth-child(3) img{object-position:50% 25%}
.capline{display:flex;justify-content:space-between;margin:8px 22px 0;font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.02em}
.stat{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:18px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);margin-top:22px}
.stat .n{font-family:var(--serif);font-size:72px;line-height:.8;color:var(--accent);letter-spacing:-.03em}
.stat .n small{font-size:30px}
.stat p{font-size:14px;line-height:1.4}
.stat .src{font-family:var(--mono);font-size:10px;color:var(--mute);margin-top:6px}
.punch{font-family:var(--serif);font-style:italic;font-size:22px;margin:16px 0 4px}
.steps{list-style:none;margin-top:14px}
.steps li{display:grid;grid-template-columns:34px 1fr;padding:11px 0;border-bottom:1px solid var(--rule2);font-size:15px}
.steps li span{font-family:var(--mono);font-size:12px;color:var(--mute);padding-top:2px}
.steps li b{font-weight:600}
.steps li em{font-style:normal;color:var(--mute)}

/* ============ team ============ */
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--ok);color:var(--ok);font-size:14px;line-height:1.4;margin-bottom:18px;border-radius:2px}
.field{margin-top:24px}
.field label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
.inrow{display:flex;align-items:flex-end;gap:12px;border-bottom:1px solid var(--ink)}
.inp{flex:1;min-width:0;border:0;background:transparent;font-family:var(--serif);font-size:32px;padding:4px 0 8px;outline:none}
.sugg{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:0 0 12px;color:var(--accent)}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sw{aspect-ratio:1;border-radius:2px;display:grid;place-items:center;color:#fff;font-family:var(--serif);font-size:22px;outline:2px solid transparent;outline-offset:3px;transition:outline-color .15s}
.sw.on{outline-color:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--ink);border-radius:2px;overflow:hidden}
.seg button{padding:13px 0;font-family:var(--mono);font-size:13px;border-left:1px solid var(--ink)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--ink);color:var(--paper)}
.stepper{display:inline-grid;grid-template-columns:48px 52px 48px;border:1px solid var(--ink);border-radius:2px}
.stepper button{height:46px;font-family:var(--mono);font-size:18px}
.stepper b{display:grid;place-items:center;font-family:var(--mono);font-weight:500;font-size:16px;border-left:1px solid var(--ink);border-right:1px solid var(--ink)}

/* ============ hub ============ */
.works{margin-top:18px;border-top:1px solid var(--ink)}
.work{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--rule)}
.work .th{width:64px;height:80px;overflow:hidden;background:#222;position:relative}
.work .th img{width:100%;height:100%;object-fit:cover}
.work .th span{position:absolute;left:0;top:0;font-family:var(--mono);font-size:10px;background:var(--paper);padding:2px 5px}
.work .wa{font-size:13px;font-weight:600}
.work .wt{font-family:var(--serif);font-size:20px;line-height:1.1;margin-top:1px}
.work .ws{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--mute);margin-top:5px;line-height:1.25}
.work .ws.m{font-family:var(--mono);font-style:normal;font-size:11px}
.work.done .ws{color:var(--ok)}
.work .go{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:9px 10px;background:var(--ink);color:var(--paper);border-radius:2px}
.work.done .go{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.note{font-family:var(--mono);font-size:11px;color:var(--mute);line-height:1.6;margin-top:12px}
.boardbox{margin-top:28px}
.bh{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;border-bottom:1px solid var(--ink)}
.bh h3{font-family:var(--serif);font-weight:400;font-size:24px}
.live{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.6s infinite}
.br{display:grid;grid-template-columns:30px 28px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--rule2);font-size:15px}
.br .r{font-family:var(--mono);font-size:13px;color:var(--mute)}
.br .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.br .s{font-family:var(--mono);font-size:14px}
.br.me{background:linear-gradient(90deg,rgba(155,42,36,.07),transparent);box-shadow:inset 2px 0 0 var(--accent);padding-left:8px;margin-left:-8px}
.br.me .r,.br.me .s{color:var(--accent);font-weight:500}
.br .you{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-left:6px}

/* ============ station ============ */
.hero{position:relative;height:430px;background:#1a1612;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .found{position:absolute;left:16px;bottom:16px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--paper);padding:6px 9px;display:flex;align-items:center;gap:8px}
.hero .found i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:block}
.cartel{border-left:2px solid var(--ink);padding:2px 0 2px 16px;margin-top:4px}
.cartel .ca{font-weight:600;font-size:16px}
.cartel .cl{font-size:13px;color:var(--mute);margin-top:1px}
.cartel .ct{font-family:var(--serif);font-style:italic;font-size:30px;line-height:1.05;margin:10px 0 8px}
.cartel .cm{font-family:var(--mono);font-size:11px;line-height:1.7;color:var(--ink2)}
.cartel .cm .hid{color:var(--accent)}
.teaser{font-family:var(--serif);font-style:italic;font-size:21px;margin-top:20px;color:var(--ink2)}
.stepk{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-top:6px}
.lookwrap{position:relative;height:360px;overflow:hidden;background:#000}
.lookwrap img{width:100%;height:100%;object-fit:cover;filter:brightness(.42) saturate(.9);transform:scale(1.08);animation:drift 15s linear forwards}
@keyframes drift{to{transform:scale(1)}}
.lookwrap .cnt{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#F4F0E8}
.lookwrap .num{font-family:var(--serif);font-size:120px;line-height:.9;font-variant-numeric:tabular-nums}
.lookwrap .unit{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;margin-top:8px}
.lookbar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:0;transition:width .25s linear}
.viewer{position:relative;width:100%;aspect-ratio:1/1;background:#1a1612;overflow:hidden;margin-top:6px}
.vimg{position:absolute;inset:0;background-repeat:no-repeat}
.vring{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border:2px solid #F4F0E8;border-radius:50%;box-shadow:0 0 0 2000px rgba(10,8,6,.42);opacity:0;transform:scale(1.6);transition:opacity .6s 1.3s,transform .6s 1.3s}
.vring.on{opacity:1;transform:scale(1)}
.vcap{position:absolute;left:12px;bottom:12px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:var(--paper);padding:4px 7px}
.opts{border-top:1px solid var(--ink)}
.opt{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:15px 2px;border-bottom:1px solid var(--rule);font-size:16px;transition:background .15s}
.opt .k{font-family:var(--mono);font-size:12px;color:var(--mute)}
.opt .st{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.opt:active{background:var(--paper2)}
.opt.ok{background:rgba(44,100,72,.08)}
.opt.ok .k,.opt.ok .st{color:var(--ok)}
.opt.bad{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--accent);animation:shake .4s}
.opt.bad .st{color:var(--accent);text-decoration:none}
.opt:disabled{pointer-events:none}
.fb{margin-top:16px;padding:14px 0 0;border-top:1px solid var(--rule);font-size:15px;line-height:1.5;animation:fade .35s ease}
.fb .t{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.fb.ok .t{color:var(--ok)} .fb.bad .t{color:var(--accent)}
.hintline{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--mute)}
.hintline button{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.hintline .h{color:var(--ink2);font-family:var(--sans);font-size:14px}
.year{font-family:var(--serif);font-size:96px;line-height:.9;letter-spacing:-.02em;margin:18px 0 10px;font-variant-numeric:tabular-nums}
.ruler{position:relative;margin-top:6px}
.ruler input{-webkit-appearance:none;appearance:none;width:100%;height:46px;background:transparent;position:relative;z-index:2;cursor:pointer}
.ruler input::-webkit-slider-runnable-track{height:1px;background:var(--ink)}
.ruler input::-moz-range-track{height:1px;background:var(--ink)}
.ruler input::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-11.5px;border-radius:50%;background:var(--accent);border:4px solid var(--paper);box-shadow:0 0 0 1px var(--accent)}
.ruler input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:4px solid var(--paper);box-shadow:0 0 0 1px var(--accent)}
.ticks{display:flex;justify-content:space-between;padding:0 12px;margin-top:-18px;pointer-events:none}
.ticks span{position:relative;width:0;display:flex;flex-direction:column;align-items:center}
.ticks span::before{content:"";width:1px;height:8px;background:var(--ink)}
.ticks span.m::before{height:4px;background:var(--mute)}
.ticks span em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--mute);margin-top:6px}
.ticks span.m em{visibility:hidden}
.tl{position:relative;height:96px;margin:10px 12px 0}
.tl .ln{position:absolute;left:-12px;right:-12px;top:44px;height:1px;background:var(--ink)}
.tl .mk{position:absolute;transform:translateX(-50%);font-family:var(--mono);font-size:11px;white-space:nowrap;display:flex;flex-direction:column;align-items:center}
.tl .mk i{width:1px;height:18px;background:currentColor;display:block}
.tl .mk.you{top:8px;color:var(--ink2)}
.tl .mk.you b{font-weight:500}
.tl .mk.real{top:44px;color:var(--accent)}
.tl .mk.real i{height:16px}
.tl .span{position:absolute;top:41px;height:7px;background:var(--accent);opacity:.25}
.poll{border-top:1px solid var(--ink)}
.pr{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:12px 0;border-bottom:1px solid var(--rule)}
.pr .pt{font-size:15px}
.pr .pp{font-family:var(--mono);font-size:13px}
.pr .bar{grid-column:1/-1;height:4px;background:var(--rule2);position:relative;overflow:hidden}
.pr .bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ink2);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.pr.mine .pt{font-weight:600}
.pr.mine .bar i{background:var(--accent)}
.pr .yt{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-left:8px}
.story{font-family:var(--serif);font-size:21px;line-height:1.42;margin:14px 0 6px}
.story::first-letter{float:left;font-size:72px;line-height:.82;padding:6px 8px 0 0;color:var(--accent)}
.story b{font-weight:400;color:var(--accent)}
.detail{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;margin:18px 0 6px;padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.detail img{width:110px;height:110px;object-fit:cover}
.detail p{font-size:13px;line-height:1.45;color:var(--ink2)}
.detail p span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.timecard{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-top:18px;padding:16px;background:var(--ink);color:var(--paper)}
.timecard .tn{font-family:var(--serif);font-size:46px;line-height:.9}
.timecard p{font-size:13px;line-height:1.45;opacity:.9}
.timecard p b{color:#F2C9A0;font-weight:600}

/* ============ stamp & receipt ============ */
.stampzone{display:grid;place-items:center;padding:30px 0 6px}
.stamp{width:190px;height:190px;color:var(--a)}
.stamp.in{animation:stampin .55s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stampin{0%{opacity:0;transform:scale(1.9) rotate(var(--r,-8deg))}55%{opacity:.95}100%{opacity:.9;transform:scale(1) rotate(var(--r,-8deg))}}
.stamp{transform:rotate(var(--r,-8deg));opacity:.92}
.receipt{margin-top:18px;border-top:1px solid var(--ink)}
.receipt div{display:flex;align-items:baseline;gap:8px;padding:10px 0;font-size:14px}
.receipt div::after{content:"";order:2;flex:1;border-bottom:1px dotted var(--rule)}
.receipt div span{order:1}
.receipt div b{order:3;font-family:var(--mono);font-weight:400;font-size:13px}
.receipt .tot{border-top:1px solid var(--ink);margin-top:4px}
.receipt .tot span,.receipt .tot b{font-weight:600;font-family:var(--mono);font-size:14px}

/* ============ passport ============ */

   --------------------------------------------------------------- */
let AC = null;
function tone(f, t, dur, vol, type){
  const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + t;
  o.type = type || 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + dur + 0.05);
}
function thump(){
  const len = AC.sampleRate * 0.12, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 3);
  const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  f.type = 'lowpass'; f.frequency.value = 700; g.gain.value = 0.5;
  src.buffer = buf; src.connect(f); f.connect(g); g.connect(AC.destination); src.start();
  tone(95, 0, 0.22, 0.35);
}
function sound(kind){
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    if (kind === 'ok') { tone(784,0,.35,.07); tone(1175,.08,.5,.06); }
    else if (kind === 'bad') { tone(220,0,.25,.06,'triangle'); tone(185,.09,.3,.05,'triangle'); }
    else if (kind === 'stamp') thump();
    else if (kind === 'win') { [523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.7,.06)); }
    else if (kind === 'tick') tone(1600,0,.03,.015);
  } catch(e){}
  try { if (navigator.vibrate) navigator.vibrate(kind==='stamp'?40:kind==='bad'?[30,40,30]:15); } catch(e){}
}

function view(f, animate, ring){
  const v = $('#art'), im = $('#vimg'); if (!v || !im) return;
  const a = ARTS[v.dataset.id], r = v.getBoundingClientRect(), W = r.width, H = r.height, ar = a.iw/a.ih;
  let cw = H*ar, ch = H; if (cw > W) { cw = W; ch = W/ar; }
  const z = f ? f.z : 1, dw = cw*z, dh = ch*z, fx = f ? f.x : .5, fy = f ? f.y : .5;
  let left = dw <= W ? (W-dw)/2 : Math.min(0, Math.max(W-dw, W/2 - fx*dw));
  let top  = dh <= H ? (H-dh)/2 : Math.min(0, Math.max(H-dh, H/2 - fy*dh));
  im.style.transition = animate ? 'background-size 1.3s cubic-bezier(.65,0,.25,1), background-position 1.3s cubic-bezier(.65,0,.25,1)' : 'none';
  im.style.backgroundSize = `${dw}px ${dh}px`; im.style.backgroundPosition = `${left}px ${top}px`;
  v._t = {left, top, dw, dh};

function startLook(id){
  const total = 15, t0 = Date.now(), n = $('#ringN'), bar = $('#lookbar'), skip = $('#lookSkip');

    if (bar) bar.style.width = Math.min(100, el/total*100) + '%';
    if (el >= 3 && skip) skip.disabled = false;
    if (el >= total) { clearInterval(lookIv); finishLook(id, true); }
  }, 200);
}
function finishLook(id, full){
  const s = S.st[id]; if (s.step !== 'look') return;
  clearInterval(lookIv);
  s.lp = full ? PTS.lookFull : PTS.lookSkip; s.step = 'tell'; save();
  renderStation(id); sound('ok'); addPoints(s.lp);
  if (full) toast(T().tSlow);
}
// tap the painting to find the detail
document.addEventListener('pointerdown', ev => {
  const v = ev.target.closest && ev.target.closest('#art'); if (!v || !v._t) return;
  const id = v.dataset.id, s = S.st[id]; if (!s || s.step !== 'find' || s.fDone) return;
  const r = v.getBoundingClientRect(), k = v._t, a = ARTS[id], f = STORY[id].find;
  const px = ev.clientX - r.left, py = ev.clientY - r.top;
  const nx = (px - k.left)/k.dw, ny = (py - k.top)/k.dh;
  const dx = nx - f.x, dy = (ny - f.y) * (a.ih/a.iw);
  const dot = $('#vdot'); dot.style.left = px + 'px'; dot.style.top = py + 'px'; dot.className = 'vdot'; void dot.offsetWidth;
  if (Math.hypot(dx, dy) <= f.r) {
    dot.classList.add('hit');
    s.fDone = true; s.zoomNow = true; s.ep = [100,70,50][s.miss] || 30; save();
    sound('ok'); setTimeout(() => { renderStation(id); addPoints(s.ep); }, 220);
  } else {
    dot.classList.add('miss'); s.miss++; save(); sound('bad');
    setTimeout(() => { const y = app.scrollTop; renderStation(id); app.scrollTop = y; }, 380);
  }
});

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-go],[data-act]'); if (!b) return;
  if (b.hasAttribute('data-go')) { ev.preventDefault(); go(b.dataset.go); return; }
  const act = b.dataset.act, id = b.dataset.id, s = id && S.st[id], a = id && ARTS[id];
  switch (act) {
    case 'lang': S.lang = S.lang === 'en' ? 'fr' : 'en'; save(); route(); break;
    case 'sound': S.sound = !S.sound; save(); b.innerHTML = icon.sound(S.sound); if (S.sound) sound('tick'); break;
    case 'reset': { const lang = S.lang; S = fresh(lang); draft = {color:0,players:3,mode:45,name:null}; save(); go('team'); break; }
    case 'dice': draft.name = NAMES[(NAMES.indexOf(draft.name)+1) % NAMES.length]; $('#tname').value = draft.name; document.querySelectorAll('.sw').forEach(x=>x.textContent = initial(draft.name)); sound('tick'); break;
    case 'color': draft.color = +b.dataset.i; document.querySelectorAll('.sw').forEach((x,i)=>x.classList.toggle('on', i===draft.color)); sound('tick'); break;
    case 'pl': draft.players = Math.max(1, Math.min(8, draft.players + (+b.dataset.d))); $('#pl').textContent = draft.players; break;
    case 'mode': draft.mode = +b.dataset.m; document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on', +x.dataset.m === draft.mode)); break;
    case 'solo': { const lang = S.lang, snd = S.sound, p = S.pending; S = fresh(lang); S.sound = snd;
      S.team = {name:T().soloName, color:'#111111', players:1, solo:true}; S.mode = 60; S.start = Date.now(); save();
      sound('ok'); go(p || 'hunt'); break; }
    case 'create': {
      const nm = ($('#tname').value || '').trim() || NAMES[0];
      const keep = {lang:S.lang, sound:S.sound}, p = S.pending;
      S = fresh(keep.lang); S.sound = keep.sound;
      S.team = {name:nm, color:COLORS[draft.color], players:draft.players}; S.mode = draft.mode; S.start = Date.now(); save();
      sound('win'); toast(fill(T().tIn, {n:nm})); go(p || 'hunt'); break;
    }
    case 'next': { const order = ['hello','look','tell','find','time','take','bye']; s.step = order[order.indexOf(s.step)+1]; save(); renderStation(id); app.scrollTop = 0; break; }
    case 'lookdone': finishLook(id, false); break;
    case 'hint': if (!s.hint) { s.hint = true; save(); renderStation(id); } break;
    case 'eagle': {
      const i = +b.dataset.i; s.tries++;
      if (i === a.eagle.a) { s.eDone = true; s.zoomNow = true; s.ep = Math.max(10, (s.tries===1 ? PTS.eagle : PTS.eagle2) - (s.hint ? PTS.hint : 0)); save();
        const y = app.scrollTop; renderStation(id); app.scrollTop = 0; sound('ok'); addPoints(s.ep); }
      else { s.wrong.push(i); save(); const y = app.scrollTop; renderStation(id); app.scrollTop = y; sound('bad'); }
      break;
    }
    case 'lock': {
      const g = +$('#yr').value; s.guess = g;
      const off = g < a.yMin ? a.yMin - g : g > a.yMax ? g - a.yMax : 0;
      s.tp = Math.max(0, PTS.timeMax - off*3); save();
      renderStation(id); sound(off===0 ? 'win' : s.tp>0 ? 'ok' : 'bad'); addPoints(s.tp); break;
    }
    case 'vote': s.vote = +b.dataset.i; s.kp = PTS.take; save(); renderStation(id); sound('ok'); addPoints(s.kp); break;
    case 'collect':
      s.end = Date.now(); s.done = true; s.step = 'done'; s.justStamped = true; s.pts = s.lp + s.ep + s.tp + s.kp + PTS.collect; save();
      renderStation(id); app.scrollTop = 0; setTimeout(()=>sound('stamp'), 180); addPoints(PTS.collect); break;
  }
});

function persona(){
  const d = doneIds(), P = T().personas;
  const first = d.filter(id => S.st[id].tries === 1).length;
  const offs = d.map(id => { const a = ARTS[id], g = S.st[id].guess; return g < a.yMin ? a.yMin-g : g > a.yMax ? g-a.yMax : 0; });
  const avgOff = offs.length ? offs.reduce((x,y)=>x+y,0)/offs.length : 999;
  const contra = d.filter(id => { const c = ARTS[id].take.crowd, v = S.st[id].vote; return v != null && c[v] === Math.min(...c); }).length;
  if (d.length && first === d.length) return P.det;
  if (d.length && avgOff <= 15) return P.time;
  if (contra >= 1) return P.con;
  return P.wan;
}

      <div><p class="num">01</p><h3>${t.att}</h3><p class="hs">${t.attS}</p>
        ${ORDER.map(id => { const a = ARTS[id], v = demo.per[id], y = stationTime(id)/1000;
          return `<div class="rw" style="--a:${a.color};grid-template-columns:34px 150px 1fr 58px"><img src="${IMG[id]}" alt="" style="object-position:${a.pos}"><span class="t">${L(a.title)}</span><div class="trk"><i style="width:${(v/maxPer*100).toFixed(1)}%"></i>${y?`<i class="you" style="width:${(y/maxPer*100).toFixed(1)}%"></i>`:''}<span class="base" style="left:${(AVG/maxPer*100).toFixed(1)}%"></span></div><b>${fmtClock(v*1000)}</b></div>`; }).join('')}
      </div>
      <div><p class="num">02</p><h3>${t.chk}</h3><p class="hs">${t.chkS}</p>
        <div class="vb">${demo.slots.map(x=>`<div class="${x[1]===41?'pk':''}"><b>${x[1]}</b><i style="height:${Math.round(x[1]/41*140)}px"></i></div>`).join('')}</div>
        <div class="vbl">${demo.slots.map(x=>`<span>${x[0]}</span>`).join('')}</div>
      </div>
    </div>
    <div class="sec">
      <div><p class="num">03</p><h3>${t.det}</h3><p class="hs">${t.detS}</p>
        ${ORDER.map(id => `<div class="acc-r"><span class="t">${L(ARTS[id].short)}</span><div class="trk" style="--a:${ARTS[id].color}"><i style="width:${demo.acc[id]}%"></i></div><b>${demo.acc[id]}%</b></div>`).join('')}
      </div>
      <div><p class="num">04</p><h3>${t.ret}</h3><p class="hs">${t.retS}</p>
        <div style="display:flex;align-items:baseline;gap:14px"><span class="big-ok">${demo.again}%</span><span class="lead">${t.retY}</span></div>
        <div class="trk" style="--a:var(--ok);margin-top:16px"><i style="width:${demo.again}%"></i></div>
      </div>
    </div>
    <div class="sec" style="grid-template-columns:1fr"><div><p class="num">05</p><h3>${t.deb}</h3><p class="hs">${t.debS}</p>
      <div class="takes">${ORDER.map(id => { const k = ARTS[id].take, mv = S.st[id] && S.st[id].vote;
        return `<div class="tk"><h4>${L(ARTS[id].short)}</h4><p class="hs" style="margin:0 0 6px">${L(k.q)}</p>${L(k.opts).map((o,i)=>`<div class="r"><span>${o}${mv===i?`<span class="yt">${t.you}</span>`:''}</span><b>${k.crowd[i]}%</b></div><div class="bar"><i style="width:${k.crowd[i]}%;${mv===i?'background:var(--accent)':''}"></i></div>`).join('')}</div>`; }).join('')}</div></div></div>
    <p class="cfoot">${t.cfoot}</p>
  </div>`;
}

/* ---------------------------------------------------------------
   TICKERS
   --------------------------------------------------------------- */
setInterval(() => {
  const el = $('#hudTime'); if (el && S.team) { const r = remaining(); el.textContent = fmtClock(r); el.classList.toggle('low', r < 5*60000); }
  const lt = $('#ltime'), cid = curStage(); if (lt && cid) lt.textContent = fmtClock(stationTime(cid));
  renderSide();
}, 1000);
setInterval(() => {
  if (!S.team || S.team.solo) return;
  const before = myRank(); let changed = false;
  S.demo.forEach(x => { if (Math.random() < .35 && x.score < 1080) { x.score = Math.min(1080, x.score + [10,20,30,50][Math.floor(Math.random()*4)]); changed = true; } });
  if (!changed) return; save();
  if (location.hash === '#leaderboard') { const b = $('#board'); if (b) b.innerHTML = standings().map((x,i)=>boardRow(x,i+1)).join(''); }
  if (myRank() > before) toast(T().tPassed);
}, 8000);
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { const id = curStage(); if (id) { const y = app.scrollTop; renderStation(id); app.scrollTop = y; } }, 200); });
if (wide.addEventListener) wide.addEventListener('change', renderSide);
route();
})();
</script>
</body>
</html>
